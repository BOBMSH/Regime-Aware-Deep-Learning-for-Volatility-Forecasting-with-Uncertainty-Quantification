seed: 17
regime:
  source: results/predictions/m04_regimes_rq4_rut.parquet
  posterior_cols:
  - jphmm_filt_p0
  - jphmm_filt_p1
  - jphmm_filt_p2
  state_col: jphmm_filt_state
  labels:
  - calm
  - transitional
  - crisis
comparison:
  exclude_models:
  - LSTM-VIX
model:
  base_features:
  - log_rv
  - oc_log_return
  regime_features:
  - reg_p0
  - reg_p1
  - reg_p2
  lookback: 10
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 90
  patience: 15
  grad_clip: 1.0
  val_fraction: 0.15
  smearing: true
approaches:
  feature_full: false
  feature_rvonly: false
  experts: true
harness:
  refit_every_folds: 0
  refit_frequency_days: 21
  scheme: anchored
  eval_segment: test
profiles:
- name: rq4_rut
  headline: false
  asset: RUT
  target: oxfordman_rv5
  regime_source: results/predictions/m04_regimes_rq4_rut.parquet
  baseline_predictions: results/predictions/m02_rq4_rut.parquet
  description: Regime-LSTM-B on the Russell 2000, conditioned on .RUT's OWN jump-penalised
    filtered posteriors, against .RUT's econometric baselines. Same architecture,
    hyperparameters, window and tests as the S&P run.
  splits:
    train_end: '2015-12-31'
    val_start: '2016-01-01'
    val_end: '2018-12-31'
    test_start: '2019-01-01'
    test_end: '2022-02-25'
- name: rq4_ftse
  headline: false
  asset: FTSE
  target: oxfordman_rv5
  regime_source: results/predictions/m04_regimes_rq4_ftse.parquet
  baseline_predictions: results/predictions/m02_rq4_ftse.parquet
  description: Regime-LSTM-B on the FTSE 100, conditioned on .FTSE's OWN filtered
    posteriors, against .FTSE's econometric baselines. A different market and session,
    so the strongest available test of whether the S&P conclusions are about the method.
  splits:
    train_end: '2015-12-31'
    val_start: '2016-01-01'
    val_end: '2018-12-31'
    test_start: '2019-01-01'
    test_end: '2022-02-25'
paths:
