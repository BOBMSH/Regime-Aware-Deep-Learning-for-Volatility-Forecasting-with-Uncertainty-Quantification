- name: yang_zhang_diagnostic
  headline: false
  target: yang_zhang
  description: TARGET-VALIDITY DIAGNOSTIC (not a result). Yang-Zhang OHLC RV over
    the same window. Its 21-day rolling smoothing pushes the target's lag-1 autocorrelation
    to ~0.996, which trivialises persistence models (random walk, HAR) and inflates
    GARCH error by ~20x. Included to justify why a genuine daily intraday RV target
    is required.
  splits:
    train_end: '2015-12-31'
    val_start: '2016-01-01'
    val_end: '2018-12-31'
    test_start: '2019-01-01'
    test_end: '2022-02-25'
