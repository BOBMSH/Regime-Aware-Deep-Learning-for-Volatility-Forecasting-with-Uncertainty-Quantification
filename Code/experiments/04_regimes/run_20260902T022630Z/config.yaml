seed: 17
features:
  primary: returns
  ablation: returns_logrv
  standardize: true
models:
  hmm:
    enabled: true
    covariance_type: full
    n_init: 12
    n_iter: 200
    tol: 0.0001
  jump:
    enabled: true
    n_init: 12
    max_iter: 40
k_grid:
- 2
- 3
- 4
jump_penalty_grid:
- 1.0
- 3.0
- 10.0
- 30.0
- 100.0
- 300.0
jump_penalty_sensitivity_grid:
- 0.5
- 1.0
- 1.5
- 2.0
- 2.5
- 3.0
- 5.0
- 10.0
- 30.0
- 100.0
- 300.0
jump_penalty: 30.0
select_by_persistence:
  enabled: true
  min_mean_duration_days: 15
vix_validation:
  enabled: true
causal_demo:
  enabled: true
  splits:
    train_end: '2015-12-31'
    val_start: '2016-01-01'
    val_end: '2018-12-31'
    test_start: '2019-01-01'
    test_end: '2022-02-25'
profiles:
- name: rq4_rut
  headline: false
  asset: RUT
  target: oxfordman_rv5
  description: Regime detection on Russell 2000 daily data over the Oxford-Man .RUT
    coverage. HMM + Nystrup jump model on that asset's own standardised daily log
    returns; K reported over {2,3,4} by BIC but fixed at 3; lambda selected on .RUT
    training rows by the pre-registered rule.
- name: rq4_ftse
  headline: false
  asset: FTSE
  target: oxfordman_rv5
  description: Regime detection on FTSE 100 daily data over the Oxford-Man .FTSE coverage.
    Same estimators, same pre-registered grid and rule, applied to .FTSE training
    rows. The VIX confusion table is a cross-market diagnostic on this asset, not
    a same-market validation.
paths:
  tables: results/tables
  figures: results/figures
  predictions: results/predictions
  milestones: results/milestones
  milestone_file: m08_regimes_{profile}.md
  experiments: experiments
_snapshot_utc: '2026-09-02T02:26:30+00:00'
_environment:
  python: 3.12.1
  python_build: CPython
  platform: Windows-11-10.0.26200-SP0
  machine: AMD64
  torch: 2.13.0+cpu
  numpy: 2.4.4
  pandas: 2.3.3
  scipy: 1.17.1
  sklearn: 1.8.0
  arch: 8.0.0
  hmmlearn: 0.3.3
  statsmodels: 0.14.6
