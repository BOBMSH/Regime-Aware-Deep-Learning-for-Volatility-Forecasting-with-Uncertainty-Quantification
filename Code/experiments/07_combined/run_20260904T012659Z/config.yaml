seed: 17
regime:
  source: results/predictions/m04_regimes_intraday_2019_2022.parquet
  posterior_cols:
  - hmm_filt_p0
  - hmm_filt_p1
  - hmm_filt_p2
  state_col: hmm_filt_state
  labels:
  - calm
  - transitional
  - crisis
model:
  base_features:
  - log_rv
  - oc_log_return
  regime_features:
  - reg_p0
  - reg_p1
  - reg_p2
  lookback: 10
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 90
  patience: 15
  grad_clip: 1.0
  val_fraction: 0.15
  smearing: true
uq:
  mc_dropout:
    mc_samples: 100
    mc_seed: 17
  levels:
  - 0.9
  - 0.95
  headline_level: 0.9
coverage:
  dq_lags: 4
  sides:
  - both
  - upper
harness:
  refit_every_folds: 0
  refit_frequency_days: 21
  scheme: anchored
  eval_segment: test
profiles:
- name: intraday_2019_2022_hmm
  headline: false
  target: oxfordman_rv5
  description: 'ROBUSTNESS (regime-estimator sensitivity, not the headline): the combined
    model and the coverage tests conditioned on the causal filtered BAUM-WELCH HMM
    posterior. Identical splits, hyperparameters and harness to the headline run,
    so the only difference is the regime estimator.'
  baseline_predictions: results/predictions/m05_regime_dl_intraday_2019_2022_hmm.parquet
  uq_predictions: results/predictions/m06_uq_intraday_2019_2022_hmm.parquet
  splits:
