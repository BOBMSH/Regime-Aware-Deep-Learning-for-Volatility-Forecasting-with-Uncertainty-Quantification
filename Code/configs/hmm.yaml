# Phase 4 -- regime detection configuration (ROADMAP.md Phase 4; Ch2 sec2.4).
# Run with:  python -m src.experiments.run_regimes
#
# Data paths, the sample window and the Oxford-Man settings are inherited from
# configs/data.yaml; this file carries the Phase-4 run settings only.
#
# Two unsupervised regime detectors are fit on the SAME feature (Ch2 sec2.4):
#   * a Gaussian-emission HMM (Baum-Welch)            -- Hamilton (1989)
#   * the Nystrup et al. (2020) jump-penalised model  -- persistent-state remedy
# The pre-registered emission (Ch2 sec2.4) is a Gaussian over STANDARDISED DAILY
# LOG RETURNS; a returns+log-RV set is carried as a richer-emission robustness
# ablation only.

seed: 17

# --- Feature sets (standardised; train-only scaling for the causal pipeline) --
features:
  primary: returns            # (ret,) -- the pre-registered emission (Ch2 sec2.4)
  ablation: returns_logrv     # (ret, log_rv) -- richer-emission robustness check
  standardize: true

# --- Regime models -----------------------------------------------------------
models:
  hmm:                        # Gaussian-emission HMM (Baum-Welch)
    enabled: true
    covariance_type: full     # full | diag (matched in the BIC parameter count)
    n_init: 12                # EM restarts; highest-likelihood fit kept
    n_iter: 200
    tol: 1.0e-4
  jump:                       # Nystrup-Lindstrom-Madsen (2020) jump model
    enabled: true
    n_init: 12                # coordinate-descent restarts; lowest-objective kept
    max_iter: 40

# --- Number of regimes: K is FIXED at 3, not selected -------------------------
# BIC is computed over this grid and REPORTED as a sensitivity; the headline K is
# fixed at 3 on interpretability grounds (calm/transitional/crisis; Ch2 sec2.4,
# Guidolin 2011; Ch3 sec3.3). The distinction is not academic here: on this
# sample the two detectors disagree, BIC preferring K=3 for the HMM and K=4 for
# the jump model (m04_regimes_intraday_2019_2022_bic.csv), so a rule of "take the
# BIC argmin" would return two different state counts for one study.
k_grid: [2, 3, 4]
headline_k: 3                 # read by run_regimes; must be one of k_grid

# --- Jump penalty (tuned, not set a priori: Ch2 sec2.4 / Nystrup 2020) --------
# lambda governs the persistence bias-variance trade-off; the sweep is reported
# and a target-persistence value is chosen for the headline jump-model map.
#
# SELECTION GRID -- pre-registered. This grid was fixed on 2026-05-15, before any
# Phase-5/6 result existed, and the selection rule ("smallest lambda whose mean
# regime duration clears the persistence floor") is applied to it on TRAINING
# ROWS ONLY. It is deliberately NOT widened after the fact: choosing a grid once
# the downstream results are visible is a garden-of-forking-paths problem, and
# the whole point of fixing it in advance is that lambda cannot be tuned to the
# answer. It selects lambda = 3.0.
jump_penalty_grid: [1.0, 3.0, 10.0, 30.0, 100.0, 300.0]

# SENSITIVITY GRID -- reported, never used for selection. The pre-registered grid
# is coarse between 1 and 3, and a finer sweep shows why that matters: the
# literal "smallest lambda clearing the floor" rule would pick 1.5 on a denser
# grid, and 1.5 sits one grid point away from the lambda = 1.0 collapse (regimes
# of 3.3 days -- exactly the over-switching pathology the penalty exists to fix),
# whereas lambda in [2, 3] is a stable plateau. Rather than silently re-select or
# quietly redefine the rule, both facts are published: the sweep below and the
# lambda-agreement table let a reader see the grid sensitivity and judge it.
# See m04's "Penalty selection and its sensitivity" section.
jump_penalty_sensitivity_grid: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 5.0, 10.0, 30.0, 100.0, 300.0]

# NOT the headline lambda. select_by_persistence is enabled below, so the rule
# above always overrides this for the headline jump model (it selects 3.0). What
# this value actually does is fix the penalty at which the K-SELECTION BIC SWEEP
# fits the jump model -- bic_over_k(..., float(cfg.jump_penalty), ...) -- so the
# entire jump_bic column of m04_*_bic.csv is computed at 30.0. CHANGING THIS
# NUMBER MOVES A PUBLISHED ARTEFACT; it is not a dead default. verify_claims'
# regime-selection check re-derives the link between the two tables.
jump_penalty: 30.0
select_by_persistence:
  enabled: true
  min_mean_duration_days: 15  # shortest acceptable average regime length

# --- External validation: VIX-quantile confusion -----------------------------
# A regime map that means anything should line up with the VIX: the calm state on
# low-VIX days, the crisis state on high-VIX days. Cross-tabulate the decoded
# state against VIX quantile bins (K bins to match K states).
vix_validation:
  enabled: true

# --- Causal (leakage-free) demonstration -------------------------------------
# The descriptive regime map is fit in-sample on the full history (standard for
# regime characterisation). Separately, fit on the training split only and filter
# causally over the test window -- the pipeline Phase 5 consumes -- and compare
# smoothed vs filtered posteriors to show where look-ahead would matter.
causal_demo:
  enabled: true
  splits:                     # identical to Phase 2/3 (configs/econometric.yaml)
    train_end: "2015-12-31"
    val_start: "2016-01-01"
    val_end: "2018-12-31"
    test_start: "2019-01-01"
    test_end: "2022-02-25"

# --- Evaluation profile ------------------------------------------------------
profiles:
  - name: intraday_2019_2022
    headline: true
    target: oxfordman_rv5
    description: "Regime detection on S&P 500 daily data over the Oxford-Man rv5 coverage (2000 -> 2022-02-25). HMM + Nystrup jump model on standardised daily log returns; K reported over {2,3,4} by BIC but fixed at 3; VIX-quantile external validation; smoothed (descriptive) and causal-filtered (Phase-5) posteriors."

# --- Output paths (mirror the other phases; results are the source of truth) --
paths:
  tables: "results/tables"
  figures: "results/figures"
  predictions: "results/predictions"
  milestones: "results/milestones"
  experiments: "experiments"
