# Phase 6 -- uncertainty quantification configuration (ROADMAP.md Phase 6; Ch2 sec2.6; RQ3).
# Run with:  python -m src.experiments.run_uq
#
# Turns the Phase-3 LSTM into a probabilistic forecaster two ways and scores both
# on the SAME anchored walk-forward as every earlier phase:
#   * MC-Dropout (primary)  -- keep the head dropout ACTIVE at inference, T=100
#     stochastic passes, predictive mean + std -> log-normal prediction intervals.
#   * Quantile regression (comparison) -- one LSTM, monotone 3-quantile head
#     (0.05/0.5/0.95), trained with the pinball loss; distribution-free intervals.
#
# As in Phase 5, hyperparameters are FIXED at the Phase-3 validation selection
# (hidden 128, lookback 10, lr 1e-3, dropout 0.1) and NOT re-swept, so the models'
# POINT forecasts stay comparable to the Phase-3 LSTM and the contrast isolates the
# effect of the uncertainty machinery rather than a fresh hyperparameter search.

seed: 17

# --- Regime signal (Phase-4 output), used ONLY for the per-regime calibration ---
# breakdown (RQ3) -- NOT as a model input (the combined regime x UQ model is Phase 7).
regime:
  source: "results/predictions/m04_regimes_intraday_2019_2022.parquet"
  # HEADLINE signal = the jump-penalised HMM (Ch2 sec2.4/sec2.8), matching Phase 5.
  # The Baum-Welch comparator runs from configs/uq_hmm.yaml.
  posterior_cols: [jphmm_filt_p0, jphmm_filt_p1, jphmm_filt_p2]
  state_col: jphmm_filt_state          # causal hard state, for the per-regime split
  labels: [calm, transitional, crisis]

# --- Network + optimisation (fixed at the Phase-3 selection) -------------------
model:
  features: [log_rv, oc_log_return]    # the Phase-3 "LSTM" feature set
  lookback: 10
  hidden_size: 128
  num_layers: 1
  dropout: 0.1                         # head dropout -> reused as the MC-Dropout source
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 90                       # matches Phase 3/5; early stopping cuts it short
  patience: 15
  grad_clip: 1.0
  val_fraction: 0.15
  smearing: true                       # log-normal retransformation term -> the MC aleatoric noise floor

# --- Uncertainty-quantification settings -------------------------------------
uq:
  mc_dropout:
    enabled: true
    mc_samples: 100                    # T stochastic forward passes (roadmap)
    mc_seed: 17                        # dropout-mask RNG seed (reproducible intervals)
  quantile:
    enabled: true
    quantiles: [0.05, 0.5, 0.95]       # monotone non-crossing head; 0.05-0.95 = 90% band
  # Central-interval nominal coverage levels to report (PICP/MPIW/Winkler):
  levels: [0.90, 0.95]
  headline_level: 0.90                 # the level common to BOTH methods (apples-to-apples)
  # Dense grid for the reliability diagram (MC-Dropout log-normal quantiles):
  reliability_taus: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]

# --- Walk-forward harness (identical to Phase 3/5) ---------------------------
harness:
  refit_every_folds: 0                 # train once on all pre-test data, reuse across OOS
  refit_frequency_days: 21             # test-fold cadence (matches Phase 2/3/5)
  scheme: anchored
  eval_segment: test

# --- Evaluation profile ------------------------------------------------------
profiles:
  - name: intraday_2019_2022
    headline: true
    target: oxfordman_rv5
    description: "Uncertainty-aware LSTM (MC-Dropout + quantile) on the canonical Oxford-Man rv5 target; test 2019-01 -> 2022-02-25, COVID-19 out-of-sample. Per-regime calibration uses the Phase-4 causal filtered HMM state."
    # Phase-5 predictions parquet (has the deterministic LSTM point + reg_state + y_true).
    baseline_predictions: "results/predictions/m05_regime_dl_intraday_2019_2022.parquet"
    lstm_point_col: "LSTM"             # deterministic Phase-3 LSTM point, for the sanity check
    splits:
      train_end: "2015-12-31"
      val_start: "2016-01-01"
      val_end: "2018-12-31"
      test_start: "2019-01-01"
      test_end: "2022-02-25"

# --- Output paths ------------------------------------------------------------
paths:
  tables: "results/tables"
  figures: "results/figures"
  predictions: "results/predictions"
  milestones: "results/milestones"
  experiments: "experiments"
